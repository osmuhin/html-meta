name: Tests

on:
  push:
    branches:
      - 'master'
  pull_request:
  schedule:
    - cron: '45 5 * * 0'

jobs:
  csfix:
    name: PHP CS Fixer
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: ctype, json, mbstring, tokenizer
        tools: composer:v2
        coverage: none

    - name: Install PHP dependencies
      env:
        COMPOSER_CAFILE: /etc/ssl/certs/ca-certificates.crt
      run: |
        composer config --global secure-http true
        composer config --global cafile "$COMPOSER_CAFILE"

        composer update --prefer-stable --no-interaction --prefer-dist --no-progress --ansi \
          || composer update --prefer-stable --no-interaction --prefer-source --no-progress --ansi

    - name: Check coding style
      run: composer csfix:check

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: ctype, dom, json, libxml, mbstring, phar, tokenizer, xml
        tools: composer:v2
        coverage: xdebug

    - name: Install PHP dependencies
      env:
        COMPOSER_CAFILE: /etc/ssl/certs/ca-certificates.crt
      run: |
        composer config --global secure-http true
        composer config --global cafile "$COMPOSER_CAFILE"

        composer update --prefer-stable --no-interaction --prefer-dist --no-progress --ansi \
          || composer update --prefer-stable --no-interaction --prefer-source --no-progress --ansi

    - name: Run tests with coverage
      run: composer test:phpunit:partial

    - name: Generate coverage badge
      run: php .github/scripts/coverage-badge.php build/logs/clover.xml .github/coverage.svg

    - name: Commit coverage badge
      if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add .github/coverage.svg
        if git diff --cached --quiet; then
          echo "Coverage badge is up to date"
          exit 0
        fi
        git commit -m "chore: update coverage badge [skip ci]"
        git push

  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        php: ['8.2', '8.3', '8.4', '8.5']
        dependency-version: [prefer-lowest, prefer-stable]

    name: PHP ${{ matrix.php }} - ${{ matrix.os }} - ${{ matrix.dependency-version }}

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: ctype, dom, json, libxml, mbstring, phar, tokenizer, xml
        tools: composer:v2
        coverage: xdebug

    - name: Setup Problem Matchers
      run: |
        echo "::add-matcher::${{ runner.tool_cache }}/php.json"
        echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

    - name: Install PHP dependencies
      env:
        COMPOSER_CAFILE: /etc/ssl/certs/ca-certificates.crt
      run: |
        # Keep strict TLS verification and use runner CA bundle explicitly.
        composer config --global secure-http true
        composer config --global cafile "$COMPOSER_CAFILE"

        # Prefer dist for speed; if GitHub API zip download fails on TLS, retry from source.
        composer update --${{ matrix.dependency-version }} --no-interaction --prefer-dist --no-progress --ansi \
          || composer update --${{ matrix.dependency-version }} --no-interaction --prefer-source --no-progress --ansi

    - name: Run Unit With PHPUnit
      run: composer test:phpunit:partial
