name: Tests

on:
  push:
    branches:
      - 'master'
  pull_request:
  schedule:
    - cron: '45 5 * * 0'

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        php: ['8.2', '8.3', '8.4']
        dependency-version: [prefer-lowest, prefer-stable]

    name: PHP ${{ matrix.php }} - ${{ matrix.os }} - ${{ matrix.dependency-version }}

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: ctype, dom, json, libxml, mbstring, phar, tokenizer, xml
        tools: composer:v2
        coverage: xdebug

    - name: Setup Problem Matchers
      run: |
        echo "::add-matcher::${{ runner.tool_cache }}/php.json"
        echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

    - name: Install PHP dependencies
      env:
        COMPOSER_CAFILE: /etc/ssl/certs/ca-certificates.crt
      run: |
        # Keep strict TLS verification and use runner CA bundle explicitly.
        composer config --global secure-http true
        composer config --global cafile "$COMPOSER_CAFILE"

        # Prefer dist for speed; if GitHub API zip download fails on TLS, retry from source.
        composer update --${{ matrix.dependency-version }} --no-interaction --prefer-dist --no-progress --ansi \
          || composer update --${{ matrix.dependency-version }} --no-interaction --prefer-source --no-progress --ansi

    - name: Run Unit With PHPUnit
      run: composer test:phpunit:partial
